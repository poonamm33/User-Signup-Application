<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Signup App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f6ff;
            text-align: center;
            padding-top: 100px;
        }

        .container {
            background: white;
            width: 400px;
            margin: auto;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 15px #ccc;
        }

        h1 {
            color: #2563eb;
        }

        button {
            width: 150px;
            padding: 12px;
            margin: 10px;
            border: none;
            border-radius: 5px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>User Signup App</h1>
    <p>Welcome to User Authentication System</p>

    <button onclick="location.href='signup.html'">
        Signup
    </button>

    <button onclick="location.href='login.html'">
        Login
    </button>
</div>

</body>
</html>
